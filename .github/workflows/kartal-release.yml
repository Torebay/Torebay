name: Kartal 1.2.0 release
on:
  push:
    branches: [kartal-1.2.0]
    paths: ['.github/workflows/kartal-release.yml', 'assistant/**', 'release/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller pillow pytest
      - name: Test desktop
        run: python -m pytest -q
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --windowed --name Kartal --icon assets/kartal.ico --add-data "assets;assets" --add-data "packaging/config.json;." --hidden-import pyttsx3.drivers.sapi5 --collect-submodules comtypes --exclude-module anthropic launch.pyw
      - name: Package Windows
        run: Compress-Archive -Path dist/Kartal -DestinationPath release/Kartal-Windows-1.2.0.zip
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem release -File | Where-Object { $_.Extension -in '.zip','.apk' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view kartal-v1.2.0 *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create kartal-v1.2.0 --target $env:GITHUB_SHA --title "Kartal 1.2.0 — Windows и Android" --notes-file release/NOTES.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload kartal-v1.2.0 release/Kartal-Windows-1.2.0.zip release/Kartal-Android-1.2.0.apk release/SHA256SUMS.txt --clobber
