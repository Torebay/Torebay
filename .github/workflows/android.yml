name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Kartal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kartal-apk
          path: Kartal.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kartal-android-${{ github.run_number }}
          name: Kartal для Android (сборка ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          body: |
            Голосовой ассистент Kartal для Android.
            Скачайте Kartal.apk на телефон и откройте его, чтобы установить.
          files: Kartal.apk
