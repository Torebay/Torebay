name: Android build

# Собирает APK приложения PingBoost и прогоняет тесты ядра.
# Готовый APK лежит в «Artifacts» внизу страницы запуска (вкладка Actions).

on:
  push:
    paths:
      - "booster/android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "booster/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: booster/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core)
        run: ./gradlew --no-daemon :core:test

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PingBoost-debug-apk
          path: booster/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
